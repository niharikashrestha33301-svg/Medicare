    function getStorage(key, defaultVal) {
      try {
        const val = localStorage.getItem(key);
        return val ? JSON.parse(val) : defaultVal;
      } catch (e) {
        return defaultVal;
      }
    }

    function DirectoryPagination({ page, count, onChange }) {

function AppointmentSlots({doctorId,slotName='timeSlot',onReady}) {
  const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  const [day,setDay]=React.useState(today),[slots,setSlots]=React.useState([]),[selected,setSelected]=React.useState(''),[busy,setBusy]=React.useState(true),[error,setError]=React.useState(''),[retry,setRetry]=React.useState(0);
  React.useEffect(()=>{
    let active=true;const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);
    onReady?.(false);setBusy(true);setError('');setSlots([]);setSelected('');
    const preview=location.protocol==='file:'||(['localhost','127.0.0.1','[::1]'].includes(location.hostname)&&['5500','5501'].includes(location.port));
    const base=preview?'http://localhost:5000/api':new URL('/api',location.href).href.replace(/\/$/,'');
    if(!day){setBusy(false);clearTimeout(timeout);return ()=>{active=false;controller.abort();};}
    fetch(base+'/doctors/'+encodeURIComponent(doctorId)+'/availability?date='+encodeURIComponent(day),{signal:controller.signal}).then(async response=>{const data=await response.json();if(!response.ok||!data.success)throw new Error(data.message||'Could not load available times.');return data;}).then(data=>{
      if(!active)return;const available=data.slots.filter(slot=>slot.available);setSlots(data.slots);setSelected(available[0]?.time||'');onReady?.(available.length>0);
    }).catch(error=>{if(active)setError(error.name==='AbortError'?'Availability timed out. Please retry.':error.message);}).finally(()=>{clearTimeout(timeout);if(active)setBusy(false);});
    return ()=>{active=false;clearTimeout(timeout);controller.abort();};
  },[doctorId,day,retry,onReady]);
  const inputClass='w-full text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-xl';
  return <div><div className="grid grid-cols-2 gap-3"><label className="text-xs font-bold text-slate-700">Appointment Date<input className={inputClass} type="date" name="date" value={day} min={today} required onChange={event=>setDay(event.target.value)}/></label><label className="text-xs font-bold text-slate-700">Available Slot (IST)<select className={inputClass} name={slotName} value={selected} onChange={event=>setSelected(event.target.value)} disabled={busy||!!error||!slots.some(slot=>slot.available)} required><option value="">{busy?'Loading times...':'Choose an available time'}</option>{slots.map(slot=><option key={slot.time} value={slot.time} disabled={!slot.available}>{slot.time}{slot.reason?' - '+slot.reason:''}</option>)}</select></label></div><p className="text-xs text-slate-500 mt-2" role="status">{error||(!busy&&!slots.some(slot=>slot.available)?'No available times on this date. Choose another date.':'Appointment times use Asia/Kolkata (IST).')}</p>{error&&<button type="button" className="text-xs text-blue-700" onClick={()=>setRetry(value=>value+1)}>Retry availability</button>}</div>;
}

        if (MedicareAPI.session()) MedicareAPI.request('/auth/me').then(data => setCurrentUser({ ...data.user, isLoggedIn: true })).catch(() => setCurrentUser(current => ({ ...current, isLoggedIn: false })));
        else setCurrentUser(current => ({ ...current, isLoggedIn: false }));
      }, []);

      useEffect(() => {
        const refresh = async () => {
          try {
            const session = MedicareAPI.session();
            if (!session) return;
            setCurrentUser({ ...session.user, isLoggedIn: true });
            setAppointments(await MedicareAPI.appointments());
          } catch (error) { showToast(error.message, 'error'); }
        };
        window.addEventListener('medicare:auth-changed', refresh);
        window.addEventListener('medicare:appointment-booked', refresh);
        return () => { window.removeEventListener('medicare:auth-changed', refresh); window.removeEventListener('medicare:appointment-booked', refresh); };

      // Master Datasets
      const [doctors, setDoctors] = useState(() => getStorage('medicare_doctors', DEFAULT_DOCTORS));
      const [hospitals, setHospitals] = useState(() => getStorage('medicare_hospitals', DEFAULT_HOSPITALS));

      useEffect(() => {

        const refreshVerification = () => {

          MedicareAPI.request('/doctors').then(data => { if (active) setDoctors(data.doctors); }).catch(() => {if(active) showToast('Cannot refresh doctor verification. Please reload when the API is available.', 'error');});

        return () => { active = false; window.removeEventListener('focus', refreshVerification); };

      const [selectedHospital, setSelectedHospital] = useState('All');

      const [bookingDoctor, setBookingDoctor] = useState(null);
      const [bookingBusy, setBookingBusy] = useState(false);
      const [availabilityReady,setAvailabilityReady]=useState(false);
      const [bookingError, setBookingError] = useState('');
      useEffect(() => { setBookingError(''); }, [bookingDoctor]);
      const [doctorBioModal, setDoctorBioModal] = useState(null);
      const [cancelModal, setCancelModal] = useState(null);
      const [emergencyModal, setEmergencyModal] = useState(false);
      const [emergencyDirectory, setEmergencyDirectory] = useState(null);

      const [toast, setToast] = useState(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Sync storage
      useEffect(() => { setStorage('medicare_doctors', doctors); }, [doctors]);
      useEffect(() => { setStorage('medicare_hospitals', hospitals); }, [hospitals]);
      useEffect(() => { setStorage('medicare_current_user', currentUser); }, [currentUser]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeView, authModalOpen, authTab, registerRole, bookingDoctor, doctorBioModal, cancelModal, emergencyModal, doctors, appointments]);

      // Filtered Doctors
      useEffect(() => { setDirectoryPage(1); }, [searchQuery, selectedSpecialty, selectedHospital]);

      const filteredDoctors = useMemo(() => {
        return doctors.filter(doc => {
          const matchQuery = searchQuery.trim() === '' ||
            doc.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            doc.specialization.toLowerCase().includes(searchQuery.toLowerCase()) ||
            doc.hospital.toLowerCase().includes(searchQuery.toLowerCase());

          const matchSpec = selectedSpecialty === 'All' || doc.specialization.toLowerCase() === selectedSpecialty.toLowerCase();
          const matchHosp = selectedHospital === 'All' || doc.hospital === selectedHospital;

          return matchQuery && matchSpec && matchHosp;
        });
      }, [doctors, searchQuery, selectedSpecialty, selectedHospital]);

      // Appointments for current user
      const userAppointments = useMemo(() => {
        if (!currentUser.isLoggedIn) return appointments;
        if (currentUser.role === 'doctor') {
          return appointments.filter(a => a.doctorEmail?.toLowerCase() === currentUser.email?.toLowerCase());
        }
        return appointments.filter(a => a.patientEmail?.toLowerCase() === currentUser.email?.toLowerCase());
      }, [appointments, currentUser]);

      // --- REGISTER HANDLER (EXACT SPLIT-SCREEN CARD FORM) ---
      const handleRegisterSubmit = async (e) => {
        e.preventDefault();
        const form = e.currentTarget;
        const submit = form.querySelector('button[type="submit"]'); submit.disabled = true;
        try {
          const data = await MedicareAPI.authenticate(form, 'register', registerRole);
          setCurrentUser({ ...data.user, isLoggedIn: true });
          setAuthModalOpen(false);
          if (data.user.role === 'doctor') {
            const directory = await MedicareAPI.request('/doctors'); setDoctors(directory.doctors);
          }
          showToast('Account created successfully', 'success');
        } catch (error) { showToast(error.message, 'error'); }
        finally { submit.disabled = false; }
      };

      // --- LOGIN HANDLER ---
      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        const form = e.currentTarget;
        const submit = form.querySelector('button[type="submit"]'); submit.disabled = true;
        try {
          const data = await MedicareAPI.authenticate(form, 'login', undefined);

            const directory = await MedicareAPI.request('/doctors'); setDoctors(directory.doctors);
          }
          showToast('Signed in successfully', 'success');
        } catch (error) { showToast(error.message, 'error'); }
        finally { submit.disabled = false; }
      };

      const handleLogout = () => {
        setCurrentUser(prev => ({ ...prev, isLoggedIn: false }));
        showToast('Logged out from Medicare+', 'info');
        localStorage.removeItem('medicare_token');
        localStorage.removeItem('mc_token');
        localStorage.removeItem('mc_user');
        window.location.assign('index.html');
      };

      // --- BOOKING HANDLER ---
      useEffect(() => {
        if (currentUser.isLoggedIn) MedicareAPI.appointments().then(setAppointments).catch(error => showToast(error.message, 'error'));
        else setAppointments([]);
      }, [currentUser.isLoggedIn]);
      const handleConfirmBooking = async bookingData => {
        if (bookingBusy) return;
        setBookingBusy(true); setBookingError('');
        try { const booked = await MedicareAPI.bookAppointment(bookingData); setAppointments(await MedicareAPI.appointments()); setBookingDoctor(null); setDoctorBioModal(null); setActiveView('appointments'); showToast(`Confirmed: ${booked.appointmentCode} | ${bookingData.date || bookingData.appointmentDate} | ${bookingData.timeSlot}`, 'success'); }
        catch (error) { setBookingError(error.message); showToast(error.message, 'error'); }
        finally { setBookingBusy(false); }

                  className="absolute top-5 right-5 z-20 w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center"
                >
                  <i data-lucide="x" className="w-4 h-4"></i>
                </button>

                {/* LEFT HERO COLUMN (Vibrant Royal Blue as in Image 2) */}
                <div className="lg:w-5/12 bg-gradient-to-br from-medBlue-600 via-medBlue-700 to-medBlue-900 text-white p-8 sm:p-10 flex flex-col justify-between">
                  <div>
                    {/* Brand Logo */}
                    <div className="flex items-center gap-2 mb-8">
                      <div className="w-8 h-8 rounded-xl bg-white/20 backdrop-blur-md flex items-center justify-center text-white font-black text-sm">
                        +
                      </div>
                      <span className="text-xl font-black tracking-tight text-white">MediCare+</span>
                    </div>

                    <h2 className="text-3xl font-black text-white leading-tight mb-4">
                      {authTab === 'register' ? 'Join our healthcare community today.' : 'Welcome back to Medicare+'}
                    </h2>
                    <p className="text-medBlue-100 text-xs sm:text-sm font-medium leading-relaxed mb-8">
                      Start your journey towards better health management. Get access to top doctors and secure medical records.
                    </p>

                    {/* Benefit Item Badges */}
                    <div className="space-y-4">
                      <div className="flex items-center gap-3">
                        <div className="w-9 h-9 rounded-xl bg-white/15 backdrop-blur-md flex items-center justify-center flex-shrink-0">
                          <i data-lucide="user-check" className="w-4 h-4 text-white"></i>
                        </div>
                        <span className="text-xs font-bold text-white">Direct access to Specialists</span>
                      </div>

                      <div className="flex items-center gap-3">
                        <div className="w-9 h-9 rounded-xl bg-white/15 backdrop-blur-md flex items-center justify-center flex-shrink-0">
                          <i data-lucide="shield-check" className="w-4 h-4 text-white"></i>
                        </div>
                        <span className="text-xs font-bold text-white">Secure Health Records</span>
                      </div>

                      <div className="flex items-center gap-3">
                        <div className="w-9 h-9 rounded-xl bg-white/15 backdrop-blur-md flex items-center justify-center flex-shrink-0">
                          <i data-lucide="calendar" className="w-4 h-4 text-white"></i>
                        </div>
                        <span className="text-xs font-bold text-white">Easy Online Booking</span>
                      </div>
                    </div>
                  </div>

                  <p className="text-[11px] text-medBlue-200 mt-8">&copy; {new Date().getFullYear()} Medicare+ Healthcare Systems</p>
                </div>

                {/* RIGHT FORM COLUMN (Multi-Column Layout from Image 2) */}
                <div className="lg:w-7/12 p-8 sm:p-10 max-h-[85vh] overflow-y-auto custom-scrollbar">
                  <div className="mb-6">
                    <h3 className="text-2xl font-extrabold text-slate-900">
                      {authTab === 'register' ? 'Create Account' : 'Sign In'}
                    </h3>
                    <p className="text-xs text-slate-500 font-medium mt-1">
                      {authTab === 'register' ? 'Please fill in the details below' : 'Enter your credentials to access your account'}
                    </p>
                  </div>

                  {/* Register Role Toggle Pill: [ As Patient ] | [ As Doctor ] */}
                  {authTab === 'register' && (
                    <div className="flex bg-slate-100 p-1.5 rounded-2xl mb-6 border border-slate-200">
                      <button
                        type="button"
                        onClick={() => setRegisterRole('patient')}
                        className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all ${
                          registerRole === 'patient' ? 'bg-white text-medBlue-600 shadow-sm' : 'text-slate-500 hover:text-slate-800'
                        }`}
                      >
                        As Patient
                      </button>
                      <button
                        type="button"
                        onClick={() => setRegisterRole('doctor')}
                        className={`flex-1 py-2 rounded-xl text-xs font-bold transition-all ${
                          registerRole === 'doctor' ? 'bg-white text-medBlue-600 shadow-sm' : 'text-slate-500 hover:text-slate-800'
                        }`}
                      >
                        As Doctor
                      </button>
                    </div>
                  )}

                  {authTab === 'register' ? (
                    <form onSubmit={handleRegisterSubmit} className="space-y-4">
                      {/* Name Row */}
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="text-[11px] font-bold text-slate-700 block mb-1">First Name</label>
                          <div className="relative">
                            <input
                              type="text"
                              name="firstName"
                              placeholder="First name"
                              required
                              className="w-full text-xs p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-medBlue-600 pl-9"
                            />
                            <i data-lucide="user" className="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
                          </div>
                        </div>
                        <div>
                          <label className="text-[11px] font-bold text-slate-700 block mb-1">Last Name</label>
                          <input
                            type="text"
                            name="lastName"
                            placeholder="Last name"
                            required
                            className="w-full text-xs p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-medBlue-600"
                          />
                        </div>
                      </div>

                      {/* Email & Phone Row */}
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="text-[11px] font-bold text-slate-700 block mb-1">Email Address</label>
                          <div className="relative">
                            <input
                              type="email" name="email"  name="email"
                              placeholder="name@example.com"
                              required
                              className="w-full text-xs p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-medBlue-600 pl-9"
                            />
                            <i data-lucide="mail" className="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
                          </div>
                        </div>
                        <div>
                          <label className="text-[11px] font-bold text-slate-700 block mb-1">Phone Number</label>
                          <div className="relative">
                            <input
                              type="tel"
                              name="phone"
                              placeholder="Mobile number (10-15 digits)"
                              required
                              className="w-full text-xs p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-medBlue-600 pl-9"
                            />
                            <i data-lucide="phone" className="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
                          </div>
                        </div>
                      </div>

                      {/* DOB & Gender */}
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="text-[11px] font-bold text-slate-700 block mb-1">Date of Birth</label>
                          <input
                            type="date"
                            name="dob"
                            defaultValue="1995-05-15"
                            required
                            className="w-full text-xs p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-medBlue-600"
                          />
                        </div>
                        <div>
                          <label className="text-[11px] font-bold text-slate-700 block mb-1">Gender</label>
                          <select name="gender" className="w-full text-xs p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none">
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                          </select>
                        </div>
                      </div>

                      {/* DOCTOR SPECIFIC FIELDS (From Image 2) */}
                      {registerRole === 'doctor' && (
                        <div className="p-4 bg-medBlue-50/60 rounded-2xl border border-medBlue-100 space-y-3">
                          <div>
                            <label className="text-[11px] font-bold text-slate-700 block mb-1">Practice Hospital / Clinic</label>
                            <select name="hospital" className="w-full text-xs p-3 bg-white border border-slate-200 rounded-xl">
                              {hospitals.map(h => <option key={h.id} value={h.name}>{h.name}</option>)}
                            </select>
                            <span className="text-[10px] text-slate-400 block mt-0.5">Select the facility where you primarily practice.</span>
                          </div>

                          <div className="grid grid-cols-2 gap-3">
                            <div>
                              <label className="text-[11px] font-bold text-slate-700 block mb-1">Specialty</label>
                              <select name="specialty" className="w-full text-xs p-3 bg-white border border-slate-200 rounded-xl">
                                {SPECIALTIES.map(s => <option key={s.name}>{s.name}</option>)}
                              </select>
                            </div>
                            <div>
                              <label className="text-[11px] font-bold text-slate-700 block mb-1">License Number</label>
                              <input type="text" name="licenseNo" placeholder="Registration No." required className="w-full text-xs p-3 bg-white border border-slate-200 rounded-xl" />
                            </div>
                          </div>

                          <div className="grid grid-cols-2 gap-3">
                            <div>
                              <label className="text-[11px] font-bold text-slate-700 block mb-1">Experience (Years)</label>
                              <input type="number" name="experience" defaultValue="8" required className="w-full text-xs p-3 bg-white border border-slate-200 rounded-xl" />
                            </div>
                            <div>
                              <label className="text-[11px] font-bold text-slate-700 block mb-1">Consultation Fee (₹)</label>
                              <input type="number" name="consultationFee" defaultValue="499" required className="w-full text-xs p-3 bg-white border border-slate-200 rounded-xl" />
                            </div>
                          </div>
                        </div>
                      )}

                      {/* Password Row */}
                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="text-[11px] font-bold text-slate-700 block mb-1">Password</label>
                          <input
                            type="password" name="password"  name="password"
                            placeholder="Enter your password"
                            required
                            className="w-full text-xs p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none"
                          />
                        </div>
                        <div>
                          <label className="text-[11px] font-bold text-slate-700 block mb-1">Confirm Password</label>
                          <input
                            type="password" name="password" placeholder="Enter your password"
                            required
                            className="w-full text-xs p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none"
                          />
                        </div>
                      </div>

                      <button
                        type="submit"
                        className="w-full py-3.5 bg-medBlue-600 hover:bg-medBlue-700 text-white font-extrabold text-xs uppercase tracking-wider rounded-2xl shadow-lg shadow-medBlue-600/30 transition-all flex items-center justify-center gap-2 mt-4"
                      >
                        <span>Create Account</span>
                        <i data-lucide="arrow-right" className="w-4 h-4"></i>
                      </button>
                    </form>
                  ) : (
                    /* SIGN IN FORM */
                    <form onSubmit={handleLoginSubmit} className="space-y-4">
                      <div>
                        <label className="text-[11px] font-bold text-slate-700 block mb-1">Email Address</label>
                        <div className="relative">
                          <input
                            type="email" name="email"  name="email"
                            defaultValue="aayush.sharma@example.com"
                            required
                            className="w-full text-xs p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-medBlue-600 pl-9"
                          />
                          <i data-lucide="mail" className="w-4 h-4 text-slate-400 absolute left-3 top-3.5"></i>
                        </div>
                      </div>

                      <div>
                        <label className="text-[11px] font-bold text-slate-700 block mb-1">Password</label>
                        <input
                          type="password" name="password" placeholder="Enter your password"
                          required
                          className="w-full text-xs p-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none"
                        />
                      </div>

                      <button
                        type="submit"
                        className="w-full py-3.5 bg-medBlue-600 hover:bg-medBlue-700 text-white font-extrabold text-xs uppercase tracking-wider rounded-2xl shadow-lg shadow-medBlue-600/30 transition-all flex items-center justify-center gap-2 mt-4"
                      >
                        <span>Sign In</span>
                        <i data-lucide="arrow-right" className="w-4 h-4"></i>
                      </button>
                    </form>
                  )}

                  <div className="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-500 font-medium">
                    {authTab === 'register' ? (
                      <p>Already have an account? <button onClick={() => setAuthTab('login')} className="text-medBlue-600 font-bold hover:underline">Sign In</button></p>
                    ) : (
                      <p>Don't have an account? <button onClick={() => setAuthTab('register')} className="text-medBlue-600 font-bold hover:underline">Register Now</button></p>
                    )}
                  </div>
                </div>

              </div>
            </div>
          )}

          {/* ================= IN-CLINIC BOOKING MODAL ================= */}
          {bookingDoctor && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-lg w-full p-8 shadow-2xl border border-slate-200 relative">
                <button
                  onClick={() => setBookingDoctor(null)}
                  className="absolute top-6 right-6 p-2 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200"
                >
                  <i data-lucide="x" className="w-4 h-4"></i>
                </button>

                <div className="flex items-center gap-4 mb-6 pb-4 border-b border-slate-100">
                  <img src={bookingDoctor.image} alt={bookingDoctor.name} className="w-14 h-14 rounded-2xl object-cover" />
                  <div>
                    <h3 className="text-lg font-bold text-slate-900">Book In-Clinic Visit</h3>
                    <p className="text-xs text-medBlue-600 font-bold">{bookingDoctor.name} &bull; {bookingDoctor.specialization}</p>
                    <p className="text-xs text-slate-400">🏥 {bookingDoctor.hospital}</p>
                  </div>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = Object.fromEntries(new FormData(e.currentTarget));
                  handleConfirmBooking({
                    doctor: bookingDoctor,
                    date: form.date,
                    timeSlot: form.timeSlot,
                    patientName: form.patientName,
                    patientEmail: form.patientEmail,
                    patientPhone: form.patientPhone,
                    patientAge: form.patientAge === '' || form.patientAge === undefined ? null : Number(form.patientAge),
                    patientGender: form.patientGender,
                    symptoms: form.symptoms
                  });
                }} className="space-y-4">
                  <AppointmentSlots doctorId={bookingDoctor.id} slotName="timeSlot" onReady={setAvailabilityReady} />
                <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">Patient Name</label>
                      <input type="text" name="patientName" defaultValue={currentUser.name} required className="w-full text-xs p-3 bg-slate-50 border border-slate-200 rounded-xl" />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-700 block mb-1">Phone Number</label>
                      <input type="tel" name="patientPhone" defaultValue={currentUser.phone} required className="w-full text-xs p-3 bg-slate-50 border border-slate-200 rounded-xl" />
                    </div>
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Medical Reason / Symptoms</label>
                    <textarea name="symptoms" rows="2" placeholder="Briefly describe your medical concerns..." className="w-full text-xs p-3 bg-slate-50 border border-slate-200 rounded-xl"></textarea>
                  </div>

                  {bookingError && <p role="alert" className="text-sm text-rose-700">{bookingError}</p>}<div className="pt-4 border-t border-slate-100 flex items-center justify-between">
                    <div>
                      <span className="text-[10px] text-slate-400 font-bold uppercase">Consultation Fee</span>
                      <p className="text-lg font-black text-slate-900">{formatINR(bookingDoctor.consultationFee)}</p>
                    </div>

                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => setBookingDoctor(null)}
                        className="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 text-xs font-bold"
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        disabled={bookingBusy || !availabilityReady || !bookingDoctor.verified || !bookingDoctor.availableSlots?.length} className="px-6 py-2.5 rounded-xl bg-medBlue-600 hover:bg-medBlue-700 text-white text-xs font-bold shadow-md shadow-medBlue-600/30"
                      >
                        {bookingBusy ? 'Booking…' : 'Confirm Booking'}
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ================= DOCTOR BIO MODAL ================= */}
          {doctorBioModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200 relative">
                <button
                  onClick={() => setDoctorBioModal(null)}
                  className="absolute top-5 right-5 p-2 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200"
                >
                  <i data-lucide="x" className="w-4 h-4"></i>
                </button>

                <div className="flex items-start gap-4">
                  <img src={doctorBioModal.image} alt={doctorBioModal.name} className="w-20 h-20 rounded-2xl object-cover border" />
                  <div>
                    <span className="text-xs font-bold text-medBlue-600 bg-medBlue-50 px-2.5 py-0.5 rounded-full">{doctorBioModal.specialization}</span>
                    <h3 className="text-lg font-bold text-slate-900 mt-1">{doctorBioModal.name}</h3>
                    <p className="text-xs text-slate-500">{doctorBioModal.qualifications}</p>
                    <p className="text-xs font-mono text-slate-400 mt-0.5">License: {doctorBioModal.licenseNo}</p>
                  </div>
                </div>

                <div className="mt-4 p-4 bg-slate-50 rounded-2xl text-xs space-y-1.5 text-slate-600">
                  <p>{doctorBioModal.about}</p>
                  <p className="pt-1"><strong>Hospital:</strong> {doctorBioModal.hospital}</p>
                  <p><strong>Experience:</strong> {doctorBioModal.experience}</p>
                  <p><strong>Fee:</strong> {formatINR(doctorBioModal.consultationFee)}</p>
                </div>

                <div className="mt-6 flex justify-end gap-2">
                  <button
                    onClick={() => setDoctorBioModal(null)}
                    className="px-4 py-2 rounded-xl text-xs font-bold border border-slate-200 text-slate-600"
                  >
                    Close
                  </button>
                  <button
                    disabled={!doctorBioModal.verified}
                    onClick={() => {
                      const doc = doctorBioModal;
                      setDoctorBioModal(null);
                      setBookingDoctor(doc);
                    }}
                    className="px-5 py-2 rounded-xl text-xs font-bold bg-medBlue-600 text-white shadow-md shadow-medBlue-600/30"
                  >
                    {doctorBioModal.verified ? "Book Slot" : "Booking unavailable"}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ================= EMERGENCY HELP MODAL ================= */}
          {emergencyModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl border border-slate-200 text-center relative">
                <button
                  onClick={() => setEmergencyModal(false)}
                  className="absolute top-5 right-5 p-2 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200"
                >
                  <i data-lucide="x" className="w-4 h-4"></i>
                </button>

                <div className="w-16 h-16 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center mx-auto mb-4">
                  <i data-lucide="ambulance" className="w-8 h-8"></i>
                </div>
                <h3 className="text-xl font-black text-slate-900">24/7 Emergency Helpline</h3>
                <p className="text-xs text-slate-500 mt-1 mb-6">Hospital emergency contacts</p>
                <div className="flex flex-wrap gap-2 mb-4 justify-center">
                  <a href="tel:112" className="px-4 py-3 rounded-xl bg-rose-600 text-white text-xs font-bold">Emergency SOS · Call 112</a>
                  <a href="tel:108" className="px-4 py-3 rounded-xl bg-teal-50 text-teal-800 text-xs font-bold">Call 108 · Where available</a>
                  <a href="./emergency.html" className="px-4 py-3 rounded-xl bg-medBlue-50 text-medBlue-700 text-xs font-bold">Nearby hospitals & Google Maps →</a>
                </div>
                <p className="text-xs text-slate-500 mb-3">Calls open your phone app. Live ambulance tracking unavailable.</p>

                <div className="space-y-3 max-h-64 overflow-y-auto text-left">
                  <p className="text-xs text-slate-500">{emergencyDirectory?.tracking.message || 'Loading stored hospital contacts. Live ambulance tracking is not connected.'}</p>
                  {(emergencyDirectory?.hospitals || []).map(h => <div key={h.id} className="p-4 bg-slate-50 border border-slate-200 rounded-2xl"><p className="font-bold text-sm">{h.name}</p><p className="text-xs text-slate-500">{h.city} ? {h.emergency}</p><a href={'tel:' + h.phone.replace(/[^+0-9]/g, '')} className="text-medBlue-700 text-sm font-bold">Hospital contact: {h.phone}</a></div>)}
                </div>

                <button
                  onClick={() => setEmergencyModal(false)}
                  className="mt-6 w-full py-3 rounded-xl bg-slate-900 text-white font-bold text-xs"
                >
                  Close Window
                </button>
              </div>
            </div>
          )}

          {/* ================= CANCEL APPOINTMENT MODAL ================= */}
          {cancelModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-200">
                <h3 className="text-base font-bold text-slate-900">Cancel Appointment?</h3>
                <p className="text-xs text-slate-500 mt-1">
                  Cancel consultation {cancelModal.id} with {cancelModal.doctorName}?
                </p>

                <div className="mt-4">
                  <label className="text-xs font-bold text-slate-700 block mb-1">Reason for cancellation:</label>
                  <select id="appCancelReason" className="w-full text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-xl">
                    <option>Change of schedule</option>
                    <option>Feeling better / symptoms resolved</option>
                    <option>Visiting another specialist</option>
                    <option>Other</option>
                  </select>
                </div>

                <div className="mt-6 flex justify-end gap-2">
                  <button
                    onClick={() => setCancelModal(null)}
                    className="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-50"
                  >
                    Keep
                  </button>
                  <button
                    onClick={() => {
                      const reason = document.getElementById('appCancelReason').value;
                      handleCancelBooking(cancelModal.id, reason);
                    }}
                    className="px-5 py-2 rounded-xl text-xs font-bold bg-rose-600 text-white shadow-md shadow-rose-600/30"
                  >
                    Confirm Cancel
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* CLEAN FOOTER */}
          <footer className="bg-slate-900 text-slate-400 text-xs py-12 border-t border-slate-800 mt-20">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2 text-white font-black text-lg">
                <div className="w-7 h-7 rounded-lg bg-medBlue-600 flex items-center justify-center text-white text-sm">
                  +
                </div>
                <span>MEDICARE<span className="text-medBlue-500">+</span></span>
              </div>

              <div className="flex items-center gap-6 text-slate-400 font-medium">
                <a href="doctor.html" className="hover:text-white transition-colors">Doctor Portal &rarr;</a>
                <a href="admin.html" className="hover:text-white transition-colors">Admin Panel &rarr;</a>
                <a href="patient.html" className="hover:text-white transition-colors">Patient Portal &rarr;</a>
              </div>

              <p className="text-slate-500">&copy; {new Date().getFullYear()} Medicare+. MySQL Healthcare Architecture.</p>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
  <script src="./frontend/public/medical-assistant.js"></script>
</body>
</html>
